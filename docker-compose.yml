services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: satplatform
      POSTGRES_PASSWORD: satplatform
      POSTGRES_DB: satplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
